<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary SEO meta tags -->
    <title>StayHealthy — Talk to a doctor, wherever you are</title>
    <meta name="title" content="StayHealthy — Talk to a doctor, wherever you are" />
    <meta
      name="description"
      content="StayHealthy connects patients in remote and underserved areas with doctors anytime, from anywhere. Book appointments, consult online, and manage your care from one place."
    />
    <meta
      name="keywords"
      content="StayHealthy, telemedicine, online doctor appointment, rural healthcare, remote healthcare access, book a doctor online, non-profit healthcare platform"
    />
    <meta name="author" content="StayHealthy" />
    <meta name="robots" content="index, follow" />
    <meta name="language" content="English" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://stayhealthy.example.org/" />
    <meta property="og:title" content="StayHealthy — Talk to a doctor, wherever you are" />
    <meta
      property="og:description"
      content="A non-profit initiative bringing accessible, patient-friendly healthcare to underserved and remote communities through a simple web platform."
    />
    <meta property="og:image" content="https://stayhealthy.example.org/og-image.png" />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://stayhealthy.example.org/" />
    <meta property="twitter:title" content="StayHealthy — Talk to a doctor, wherever you are" />
    <meta
      property="twitter:description"
      content="Book appointments, consult doctors online, and manage your care — built for communities with limited healthcare infrastructure."
    />
    <meta property="twitter:image" content="https://stayhealthy.example.org/og-image.png" />

    <meta name="theme-color" content="#0F4C43" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,500&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
